<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>The input element</h1>

    <form>
        <label>Enter First Number</label>
        <input type="number" id="num1"><br><br>

        <label>Enter Second Number</label>
        <input type="number" id="num2"><br><br>

        <label>Enter Operator</label>
        <!-- <input type="number" id="operator"><br><br> -->
        <select name="" id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <button onclick="calculate(event)">Calculate</button>
    </form>


    <p id="answer">Answer will appear here</p>

    <script>
        const calculate = (event) => {
            event.preventDefault();
            const num1 = parseFloat(document.getElementById(`num1`).value);
            const num2 = parseFloat(document.getElementById(`num2`).value);
            const operator = document.getElementById(`operator`).value;
            const answer = document.getElementById(`answer`);
            if (Number.isNaN(num1) || Number.isNaN(num2)) {
                answer.textContent = "Please enter both numbers.";
                return;
            }
            let result;

            if (operator == "+") {
                result = num1 + num2;
            } else if (operator == "-") {
                result = num1 - num2;
            } else if (operator == "*") {
                result = num1 * num2;
            } else result = num1 / num2;
            answer.innerHTML = `${result}`;
        }

    </script>
</body>

</html>
